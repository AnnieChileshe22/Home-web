<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Schools | Mukuba University</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1b2a3a;
        }
        .schools-page {
            padding: 60px 20px 80px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header p {
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #0f766e;
            font-weight: 700;
            font-size: 12px;
            margin: 0 0 12px;
        }
        .page-header h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.5rem);
        }
        .school-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
        }
        .school-card {
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 36px rgba(17, 24, 39, 0.08);
            border: 1px solid rgba(15, 118, 110, 0.08);
        }
        .school-image {
            position: relative;
            height: 220px;
            overflow: hidden;
        }
        .school-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .school-image::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 23, 37, 0.7), transparent 42%);
        }
        .school-content {
            padding: 20px 20px 26px;
            margin-top: -30px;
            position: relative;
            z-index: 1;
            background: #fff;
            border-radius: 18px 18px 0 0;
        }
        .school-tag {
            display: inline-block;
            background: rgba(15, 118, 110, 0.08);
            color: #0f766e;
            border-radius: 999px;
            font-size: 11px;
            padding: 8px 10px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .school-card h2 {
            margin: 0 0 10px;
            font-size: 1.4rem;
            line-height: 1.3;
        }
        .school-card p {
            margin: 0;
            color: #53657d;
            line-height: 1.6;
            font-size: 0.96rem;
        }
        .school-card a {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 14px;
            background: #0f766e;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 10px;
        }
    </style>
    <link rel="stylesheet" href="../public/css/api-sections.css">
    <script src="../public/js/api-sections.js" defer></script>
</head>
<body>
    <main class="schools-page">
        <div class="container">
            <header class="page-header">
                <p>Academic excellence</p>
                <h1>Our Schools</h1>
            </header>

            <section class="school-grid" data-api-section="../public/index.php/data/schools" aria-busy="true" aria-live="polite"><div class="api-section-status" role="status"><span class="api-spinner" aria-hidden="true"></span><span>Loading...</span></div></section>
        </div>
    </main>
</body>
</html>
